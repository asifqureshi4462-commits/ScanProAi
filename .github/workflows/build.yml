name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Prepare Project and Gradlew
        run: |
          # 1. Agar files 'ScanProAi-main' subfolder ke andar hain to unhe root par shift karo
          if [ ! -f "settings.gradle.kts" ] && [ -d "ScanProAi-main" ]; then
            echo "Project files found inside ScanProAi-main subfolder. Moving to root..."
            shopt -s dotglob
            mv ScanProAi-main/* .
          fi

          # 2. Agar gradlew file missing hai to automatically nayi generate karo
          if [ ! -f "./gradlew" ]; then
            echo "gradlew not found. Generating fresh wrapper..."
            gradle wrapper
          fi

          # 3. Executable permission assign karo
          chmod +x ./gradlew

          # 4. .env file create karo (secrets plugin ke liye)
          echo "GEMINI_API_KEY=AIzaSyFakeKeyForCiBuildTestingOnly12345" > .env
          echo "GEMINI_API_KEY=AIzaSyFakeKeyForCiBuildTestingOnly12345" > .env.example

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ScanProAI-Debug-APK
          path: '**/build/outputs/apk/debug/*.apk'
          retention-days: 7
